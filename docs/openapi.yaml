openapi: 3.0.3
info:
  title: Build A PC API
  description: >-
    API for managing PC builds, part compatibility, and user accounts across web and Android.
    Implemented operations include GET /, GET /actuator/health, POST /auth/github,
    GET /me, GET /parts, GET /parts/{id}, and GET /admin/users. Catalog and user lists support search.
    Other operations describe the planned API contract.
    Versioned API responses use application/json and errors use application/problem+json.
    Database readiness is exposed by Spring Boot Actuator at /actuator/health using
    application/vnd.spring-boot.actuator.v3+json.
    Unsupported HTTP methods return HTTP 405 Problem Details with an Allow header;
    methods on planned operations are not available until implemented.
    Unknown routes return HTTP 404 Problem Details.
  version: 1.0.0

servers:
  - url: /api/v1
    description: Base API routing

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: API-issued short-lived JWT from /auth endpoints.

  schemas:
    ApiInfo:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          example: Build A PC API
        version:
          type: string
          example: v1

    PageMetadata:
      type: object
      description: >-
        Zero-based pagination. Requests beyond the last page return empty content with
        the actual totals. Empty collections have totalPages 0. page multiplied by size
        must not exceed 2147483647.
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    PartPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Part'

    BuildPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Build'

    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, email, display_name, role, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
          nullable: true
        role:
          type: string
          enum: [ USER, ADMIN ]
        created_at:
          type: string
          format: date-time

    Part:
      type: object
      description: General part information mapping to CATALOG_PARTS.
      required: [part_id, category, name, price, created_at]
      properties:
        part_id:
          type: string
          format: uuid
        category:
          type: string
        name:
          type: string
        price:
          type: number
          format: double
          nullable: true
        created_at:
          type: string
          format: date-time

    Build:
      type: object
      description: User PC build mapping to PC_BUILDS.
      properties:
        build_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time

    BuildCompatibility:
      type: object
      properties:
        compatible:
          type: boolean
        issues:
          type: array
          items:
            type: string

    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details for errors.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: A URI reference identifying the problem type; about:blank is used for generic problems.
          example: about:blank
        title:
          type: string
          description: A short, human-readable summary of the problem.
        status:
          type: integer
          description: The HTTP status code for this occurrence.
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: The request path for this occurrence.
        errors:
          type: array
          description: Optional field validation errors.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    GoogleAuthRequest:
      oneOf:
        - type: object
          required: [code, code_verifier, redirect_uri]
          properties:
            code:
              type: string
            code_verifier:
              type: string
            redirect_uri:
              type: string
              format: uri
              description: The same redirect URI used in the authorization request.
        - type: object
          required: [idToken]
          properties:
            idToken:
              type: string
              description: Google ID token from native Google Sign-In.

    GitHubAuthRequest:
      type: object
      required: [code, codeVerifier, redirectUri]
      properties:
        code:
          type: string
          minLength: 1
          description: Single-use authorization code returned by GitHub.
        codeVerifier:
          type: string
          minLength: 43
          maxLength: 128
          description: Original PKCE verifier used to generate the S256 challenge.
        redirectUri:
          type: string
          format: uri
          description: Must exactly match a configured callback and the authorization request.
          example: http://localhost:8081/auth

    GitHubAuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: API-issued HS256 JWT, valid for one hour by default; never a GitHub access token.
        user:
          $ref: '#/components/schemas/User'
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: Short-lived JWT.
  parameters:
    Search:
      name: q
      in: query
      required: false
      description: >-
        Trimmed, case-insensitive substring search. Percent and underscore are literal
        characters. Blank or omitted values list all records. A valid UUID also matches
        an exact record ID. User lists search email/display_name; parts search name/category.
      schema:
        type: string
    Page:
      name: page
      in: query
      description: Zero-based page index. page multiplied by size must not exceed 2147483647.
      schema:
        type: integer
        minimum: 0
        maximum: 2147483647
        default: 0
    Size:
      name: size
      in: query
      description: Maximum number of records to return per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    AuthConflict:
      description: Verified email already belongs to another provider. Detail names that provider; no account is created or linked.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: This email is already registered with Google. Sign in with Google.
            instance: /api/v1/auth/github
    ProviderUnavailable:
      description: GitHub could not be reached or returned an unusable upstream response. Never include provider tokens or secrets.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: The authenticated user is not allowed to perform this action.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: A verified email is already registered with the other sign-in provider.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: The requested route or resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotAcceptable:
      description: The requested response format is not supported; successful responses require application/json.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalServerError:
      description: An unexpected server error occurred.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

paths:
  /:
    get:
      tags: [System]
      summary: Get API name and version
      responses:
        '200':
          description: API information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInfo'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /actuator/health:
    servers:
      - url: /
        description: Spring Boot Actuator endpoint at the application root
    get:
      tags: [System]
      summary: Check application and database health
      responses:
        '200':
          description: The application and configured database are healthy.
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [UP]
        '503':
          description: The application or configured database is unhealthy.
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [DOWN]

  /auth/github:
    post:
      tags: [Auth]
      summary: Exchange GitHub authorization code for API JWT
      description: >-
        Public endpoint. Exchange using server-held credentials selected by the exact
        allowlisted redirect URI. Verify GitHub identity and primary email, then reuse
        an existing identity or create a user and identity transactionally.
        Missing or invalid input, rejected code or PKCE verifier, an unapproved redirect,
        or an unverified primary email returns 400. Failed login persists nothing.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubAuthRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubAuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/AuthConflict'
        '502':
          $ref: '#/components/responses/ProviderUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/google:
    post:
      tags: [ Auth ]
      summary: Authenticate with Google and receive an API JWT
      description: Web sends an authorization code with PKCE fields; native sends a Google ID token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /me:
    get:
      tags: [ Users ]
      summary: Get current logged-in user profile
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: User profile data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/me:
    put:
      tags: [ Users ]
      summary: Update user profile
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Profile updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [ Users ]
      summary: Delete user account
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Account deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /parts:
    get:
      tags: [ Parts ]
      summary: Get list of general PC parts
      description: Public database search over part name/category, ordered by ID for consistent pagination.
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of parts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [ Parts ]
      summary: Add a new PC part
      security:
        - bearerAuth: [ ]
      responses:
        '201':
          description: Part created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /parts/{id}:
    get:
      tags: [ Parts ]
      summary: Get specific part details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Part details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Part'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [ Parts ]
      summary: Update specific part details
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Part updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /builds:
    get:
      tags: [ Builds ]
      summary: Retrieve all saved builds for the authenticated user
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: A page of user builds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [ Builds ]
      summary: Initialize a new PC build
      security:
        - bearerAuth: [ ]
      responses:
        '201':
          description: Build created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /builds/{id}:
    get:
      tags: [ Builds ]
      summary: Retrieve a specific build
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Build details and selected parts
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [ Builds ]
      summary: Modify a build (add/remove parts)
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Build updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /builds/{id}/compatibility:
    get:
      tags: [ Builds ]
      summary: Evaluate build compatibility
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Compatibility status and conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildCompatibility'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/users:
    get:
      tags: [ Admin ]
      summary: View and search user data
      description: >-
        Requires a valid app JWT and an existing user whose current database role is ADMIN.
        The JWT subject identifies the user; a role copied into the JWT does not grant access
        after database demotion. Returns approved profile fields only, ordered by ID.
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: A page of users (Admin only)
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/users/{id}:
    delete:
      tags: [ Admin ]
      summary: Delete a user
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted by admin
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/parts:
    post:
      tags: [ Admin ]
      summary: Add new part data
      security:
        - bearerAuth: [ ]
      responses:
        '201':
          description: Part created by admin
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/parts/{id}:
    put:
      tags: [ Admin ]
      summary: Update existing part information
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Part updated by admin
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [ Admin ]
      summary: Remove part data
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Part deleted by admin
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
