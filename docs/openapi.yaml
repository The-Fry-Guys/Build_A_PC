openapi: 3.0.3
info:
  title: Build A PC API
  description: API for managing PC builds, part compatibility, and user accounts across web and Android.
  version: 1.0.0

servers:
  - url: /api/v1
    description: Base API routing

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: API-issued short-lived JWT from /auth endpoints.

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          type: string
          enum: [ USER, ADMIN ]
        created_at:
          type: string
          format: date-time

    Part:
      type: object
      description: General part information mapping to CATALOG_PARTS.
      properties:
        part_id:
          type: string
          format: uuid
        category:
          type: string
        name:
          type: string
        price:
          type: number
          format: double
        created_at:
          type: string
          format: date-time

    Build:
      type: object
      description: User PC build mapping to PC_BUILDS.
      properties:
        build_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time

    BuildCompatibility:
      type: object
      properties:
        compatible:
          type: boolean
        issues:
          type: array
          items:
            type: string

    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details for errors.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: A URI reference identifying the problem type; about:blank is used for generic problems.
          example: about:blank
        title:
          type: string
          description: A short, human-readable summary of the problem.
        status:
          type: integer
          description: The HTTP status code for this occurrence.
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: The request path for this occurrence.
        errors:
          type: array
          description: Optional field validation errors.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    AuthRequest:
      type: object
      properties:
        code:
          type: string
        code_verifier:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: Short-lived JWT.
  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: The authenticated user is not allowed to perform this action.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: The requested route or resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalServerError:
      description: An unexpected server error occurred.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

paths:
  /auth/github:
    post:
      tags: [Auth]
      summary: Exchange GitHub authorization code for API JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/google:
    post:
      tags: [ Auth ]
      summary: Exchange Google authorization code for API JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/me:
    get:
      tags: [ Users ]
      summary: Get current logged-in user profile
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: User profile data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [ Users ]
      summary: Update user profile
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Profile updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [ Users ]
      summary: Delete user account
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Account deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /parts:
    get:
      tags: [ Parts ]
      summary: Get list of general PC parts
      responses:
        '200':
          description: A list of parts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Part'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [ Parts ]
      summary: Add a new PC part
      security:
        - bearerAuth: [ ]
      responses:
        '201':
          description: Part created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /parts/{id}:
    get:
      tags: [ Parts ]
      summary: Get specific part details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Part details
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [ Parts ]
      summary: Update specific part details
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Part updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /builds:
    get:
      tags: [ Builds ]
      summary: Retrieve all saved builds for the authenticated user
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: List of user builds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Build'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [ Builds ]
      summary: Initialize a new PC build
      security:
        - bearerAuth: [ ]
      responses:
        '201':
          description: Build created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /builds/{id}:
    get:
      tags: [ Builds ]
      summary: Retrieve a specific build
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Build details and selected parts
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [ Builds ]
      summary: Modify a build (add/remove parts)
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Build updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /builds/{id}/compatibility:
    get:
      tags: [ Builds ]
      summary: Evaluate build compatibility
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Compatibility status and conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildCompatibility'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/users:
    get:
      tags: [ Admin ]
      summary: View and search user data
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: List of all users (Admin only)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/users/{id}:
    delete:
      tags: [ Admin ]
      summary: Delete a user
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted by admin
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/parts:
    post:
      tags: [ Admin ]
      summary: Add new part data
      security:
        - bearerAuth: [ ]
      responses:
        '201':
          description: Part created by admin
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/parts/{id}:
    put:
      tags: [ Admin ]
      summary: Update existing part information
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Part updated by admin
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [ Admin ]
      summary: Remove part data
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Part deleted by admin
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
