# Isolated fixtures only: docker compose --env-file /dev/null -f compose.e2e.yml up --build -d
services:
  api:
    build: ./api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: e2e
      # Public, local-only fixture key; never production signing material.
      APP_JWT_SECRET_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/buildapc_e2e
      SPRING_DATASOURCE_USERNAME: buildapc_e2e
      SPRING_DATASOURCE_PASSWORD: local-e2e-only
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: buildapc_e2e
      POSTGRES_USER: buildapc_e2e
      POSTGRES_PASSWORD: local-e2e-only
    volumes:
      - ./api/src/main/resources/db/migration/V1__initial_schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./api/src/test/resources/e2e-seed.sql:/docker-entrypoint-initdb.d/002-fixtures.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U buildapc_e2e -d buildapc_e2e"]
      interval: 2s
      timeout: 5s
      retries: 30
