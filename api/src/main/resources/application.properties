spring.application.name=Build_A_PC
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Select server-owned credentials by exact configured redirect URI.
app.oauth.github.web.client-id=${GITHUB_WEB_CLIENT_ID:}
app.oauth.github.web.client-secret=${GITHUB_WEB_CLIENT_SECRET:}
app.oauth.github.web.redirect-uri=${GITHUB_WEB_REDIRECT_URI:http://localhost:8081/auth}
app.oauth.github.android.client-id=${GITHUB_ANDROID_CLIENT_ID:}
app.oauth.github.android.client-secret=${GITHUB_ANDROID_CLIENT_SECRET:}
app.oauth.github.android.redirect-uri=${GITHUB_ANDROID_REDIRECT_URI:client://auth}
app.jwt.issuer=${APP_JWT_ISSUER:http://localhost:8080}
app.jwt.secret-base64=${APP_JWT_SECRET_BASE64:}
app.jwt.ttl=${APP_JWT_TTL:PT1H}
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:8081}

# Swagger UI uses our handwritten contract; generated implemented routes remain available.
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.paths-to-match=/api/v1/**
