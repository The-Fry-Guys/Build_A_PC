# ServiceConnection overrides this deliberately unreachable fallback.
# A missing container configuration must never fall back to hosted credentials.
spring.datasource.url=jdbc:postgresql://127.0.0.1:1/unconfigured-test
spring.datasource.username=unused
spring.datasource.password=unused
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=0
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# Public fixture key for automated tests only. Never use in deployed environments.
app.jwt.issuer=https://buildapc.test
app.jwt.secret-base64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.jwt.ttl=PT1H
