# Run from the api folder: docker compose up --build
#
# Set LOCAL_DB_PASSWORD in the shell before starting the local development stack.
services:
  expo:
    build:
      context: ../client
    ports:
      - "8081:8081"
    environment:
      EXPO_PACKAGER_PROXY_URL: ${EXPO_PACKAGER_PROXY_URL:-http://localhost:8081}
    volumes:
      - ../client/src:/app/src
      - ../client/assets:/app/assets
      - ../client/app.json:/app/app.json
    stdin_open: true
    tty: true

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/buildapc
        SPRING_DATASOURCE_USERNAME: buildapc
        SPRING_DATASOURCE_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD for the local database}
        SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: buildapc
      POSTGRES_USER: buildapc
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD for the local database}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildapc -d buildapc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
