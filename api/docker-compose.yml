# Run from the api folder: docker compose up --build
#
# Still needed:
# TODO: move credentials to a .env file / secrets manager (change-me is a placeholder)
# TODO: add application-prod.properties and a prod compose file (don't expose 5432 in prod)
# TODO: React Native app must call http://<computer-LAN-IP>:8080 on a physical device, not localhost
services:
  expo:
    build:
      context: ../client
    ports:
      - "8081:8081"
    environment:
      EXPO_PACKAGER_PROXY_URL: ${EXPO_PACKAGER_PROXY_URL:-http://localhost:8081}
    volumes:
      - ../client/src:/app/src
      - ../client/assets:/app/assets
      - ../client/app.json:/app/app.json
    stdin_open: true
    tty: true

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    env_file:
      - ../.env
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/buildapc
      SPRING_DATASOURCE_USERNAME: buildapc
      SPRING_DATASOURCE_PASSWORD: change-me
      # The SQL initialization script owns schema creation on fresh volumes.
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: buildapc
      POSTGRES_USER: buildapc
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./src/main/resources/db/migration/V1__initial_schema.sql:/docker-entrypoint-initdb.d/001-initial-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildapc -d buildapc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
