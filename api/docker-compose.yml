# Run from the repository root: docker compose up --build
services:
  expo:
    build:
      context: ../client
    env_file:
      - ../client/.env
    ports:
      - "8081:8081"
    environment:
      EXPO_PACKAGER_PROXY_URL: ${EXPO_PACKAGER_PROXY_URL:-http://localhost:8081}
    volumes:
      - ../client/src:/app/src
      - ../client/assets:/app/assets
      - ../client/app.json:/app/app.json
    stdin_open: true
    tty: true

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    env_file:
      - ../.env
    ports:
      - "8080:8080"
    environment:
      # Compose networking uses the service name. DB_URL is for host-run Spring Boot.
      SPRING_DATASOURCE_URL: ${COMPOSE_DB_URL:-jdbc:postgresql://db:5432/buildapc}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:?required}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?required}
      # The SQL initialization script owns schema creation on fresh volumes.
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: buildapc
      POSTGRES_USER: ${DB_USER:?required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./src/main/resources/db/migration/V1__initial_schema.sql:/docker-entrypoint-initdb.d/001-initial-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
