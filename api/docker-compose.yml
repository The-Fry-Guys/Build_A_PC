# Run from the api folder: docker compose --env-file ../.env up --build
#
# Local development only. Physical devices need a reachable LAN or HTTPS API URL.
services:
  expo:
    build:
      context: ../client
    ports:
      - "8081:8081"
    environment:
      EXPO_PACKAGER_PROXY_URL: ${EXPO_PACKAGER_PROXY_URL:-http://localhost:8081}
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      EXPO_PUBLIC_GITHUB_WEB_CLIENT_ID: ${GITHUB_WEB_CLIENT_ID:-}
      EXPO_PUBLIC_GITHUB_ANDROID_CLIENT_ID: ${GITHUB_ANDROID_CLIENT_ID:-}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
    volumes:
      - ../client/src:/app/src
      - ../client/assets:/app/assets
      - ../client/app.json:/app/app.json
    stdin_open: true
    tty: true

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    env_file:
      - ../.env
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/buildapc
      SPRING_DATASOURCE_USERNAME: ${DB_USER:?required}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?required}
      # The SQL initialization script owns schema creation on fresh volumes.
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: buildapc
      POSTGRES_USER: ${DB_USER:?required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./src/main/resources/db/migration/V1__initial_schema.sql:/docker-entrypoint-initdb.d/001-initial-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildapc -d buildapc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
