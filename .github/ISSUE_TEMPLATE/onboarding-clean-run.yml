name: Visitor onboarding clean run
description: Record a successful visitor run with every command and result.
title: "[onboarding] Clean run — "
labels: [onboarding]
body:
  - type: input
    id: teams
    attributes:
      label: Visitor and host team numbers
    validations:
      required: true
  - type: input
    id: participants
    attributes:
      label: Visitors and hosts
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands run and results
      description: List each command in order and its result.
      render: shell
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: Operating system and version
    validations:
      required: true
  - type: input
    id: docker_version
    attributes:
      label: Docker Engine/Desktop and Compose versions
    validations:
      required: true
