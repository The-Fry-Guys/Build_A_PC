name: Scan with Detekt

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "36 10 * * 4"
  workflow_dispatch:

env:
  # SARIF support requires Detekt >= 1.15.0; 1.23.x emits repo-relative URIs
  DETEKT_VERSION: 1.23.8

permissions:
  contents: read

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Download Detekt CLI
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/detekt.jar" \
            "https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}-all.jar"

      - name: Run Detekt
        run: |
          set +e
          java -jar "$RUNNER_TEMP/detekt.jar" \
            --input api/src \
            --base-path "$GITHUB_WORKSPACE" \
            --report "sarif:${GITHUB_WORKSPACE}/detekt.sarif.json"
          status=$?
          set -e
          # Detekt uses exit code 2 for findings; report them in code scanning.
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi
          test -s "$GITHUB_WORKSPACE/detekt.sarif.json"

      - name: Upload SARIF results
        if: ${{ always() && hashFiles('detekt.sarif.json') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: detekt.sarif.json
          checkout_path: ${{ github.workspace }}
