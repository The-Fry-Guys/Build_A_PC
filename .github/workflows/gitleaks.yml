name: Secret scanning

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan committed history
        # The CLI needs no organization license or provider credentials.
        # Mount only Git history and scanner config; local environment files are never scanned.
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/.git,target=/repo/.git,readonly" \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/.gitleaks.toml,target=/repo/.gitleaks.toml,readonly" \
            --workdir /repo \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/repo \
            --entrypoint /bin/sh \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            -c 'git -C /repo log -1 --format=%H > /dev/null && exec gitleaks git --redact=100 --no-banner --log-opts="--all" /repo'
